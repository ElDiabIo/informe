<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f4ef; --card: #fffefb; --ink: #1d1b18; --ink2: #4a4640; --muted: #736d65;
    --line: #e5e0d6; --acc: #c2410c; --up: #15803d; --down: #b91c1c; --btnink: #fffefb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-modo="claro"]) {
      --bg: #0f141c; --card: #151c27; --ink: #e8edf4; --ink2: #b9c3d1; --muted: #8592a5;
      --line: #253041; --acc: #6b9bf2; --up: #4cc38a; --down: #f07167; --btnink: #0f141c;
    }
  }
  :root[data-modo="claro"] { color-scheme: light; }
  :root[data-modo="oscuro"] {
    color-scheme: dark;
    --bg: #0f141c; --card: #151c27; --ink: #e8edf4; --ink2: #b9c3d1; --muted: #8592a5;
    --line: #253041; --acc: #6b9bf2; --up: #4cc38a; --down: #f07167; --btnink: #0f141c;
  }
  html, body { margin: 0; }
  body {
    box-sizing: border-box; min-height: 100vh; min-height: 100dvh; padding: 24px 16px;
    display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 15px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  form {
    box-sizing: border-box; width: min(380px, 100%); padding: 28px 26px 22px;
    display: grid; gap: 16px; background: var(--card); border: 1px solid var(--line);
  }
  h1, p { margin: 0; }
  .cab { display: grid; gap: 2px; }
  .cab-fila { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.015em; }
  .cuenta { font-size: 12.5px; color: var(--muted); }
  .fecha { font-size: 13px; color: var(--muted); }
  .campo { display: grid; gap: 6px; }
  .campo span { font-size: 12.5px; font-weight: 500; color: var(--ink2); }
  #frase {
    box-sizing: border-box; width: 100%; min-width: 0; margin: 0; padding: 11px 12px;
    font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
    border-radius: 0; outline: none; -webkit-appearance: none; appearance: none;
  }
  #frase:focus { border-color: var(--acc); }
  form[data-estado="error"] #frase { border-color: var(--down); }
  /* En las pantallas táctiles, a 16 px: con menos, Safari en iOS amplía la página al tocar el campo. */
  @media (pointer: coarse) { #frase { font-size: 16px; } }
  .casilla { display: flex; gap: 9px; align-items: center; font-size: 13.5px; color: var(--ink2); cursor: pointer; }
  #recordar { width: 15px; height: 15px; margin: 0; accent-color: var(--acc); }
  #abrir {
    margin: 0; padding: 11px 12px; font: inherit; font-weight: 600; color: var(--btnink); background: var(--acc);
    border: 0; border-radius: 0; cursor: pointer; -webkit-appearance: none; appearance: none;
  }
  #abrir:hover { filter: brightness(1.08); }
  #abrir:disabled { opacity: 0.6; cursor: default; filter: none; }
  #aviso { min-height: 20px; font-size: 13px; color: var(--muted); }
  form[data-estado="error"] #aviso, form[data-estado="navegador"] #aviso { color: var(--down); }
  form[data-estado="olvidada"] #aviso { color: var(--up); }
  .pie {
    border-top: 1px solid var(--line); padding-top: 12px; font-size: 12px; color: var(--muted); text-wrap: pretty;
  }
  .pie code { font-family: ui-monospace, monospace; font-size: inherit; }
</style>
</head>

<form id="formulario" autocomplete="off">
  <div class="cab">
    <div class="cab-fila"><h1>Cartera</h1><span class="cuenta">IBKR</span></div>
    <p class="fecha">Informe del 14 nov 2026, 19:20</p>
  </div>
  <label class="campo"><span>Frase</span>
    <input id="frase" type="password" autocomplete="current-password" required></label>
  <label class="casilla"><input id="recordar" type="checkbox">Recordar en este dispositivo</label>
  <button id="abrir" type="submit">Abrir</button>
  <p id="aviso" role="alert"></p>
  <p class="pie">El informe está cifrado. Para olvidar la frase en este dispositivo, abre la página con
    <code>?olvidar</code>.</p>
</form>

  var CLAVE_LS = "informe.clave." + SOBRE.sal;
  var formulario = document.getElementById("formulario");
  var campo = document.getElementById("frase");
  var recordar = document.getElementById("recordar");
  var boton = document.getElementById("abrir");
  var aviso = document.getElementById("aviso");

  function bytes(b64) {
    var s = atob(b64), u = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
    return u;
  }
  function base64(u) {
    var s = "";
    for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
    return btoa(s);
  }
  // El aviso y el estado de la pantalla (abriendo, error, olvidada o
  // navegador; "" es el normal), que el CSS pinta en el aviso y en el campo.
  function decir(texto, estado) {
    aviso.textContent = texto;
    formulario.setAttribute("data-estado", estado || "");
  }
  // Mientras se abre, ni el campo ni el botón, y el botón dice «Abriendo…».
  function ocupado(si) {
    campo.disabled = boton.disabled = si;
    boton.textContent = si ? "Abriendo…" : "Abrir";
  }

  async function derivar(frase) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(frase.normalize("NFC")),
                                             "PBKDF2", false, ["deriveBits"]);
    var bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: bytes(SOBRE.sal),
                                                iterations: SOBRE.iter }, base, 256);
    return new Uint8Array(bits);
  }
  async function descifrar(clave) {
    var k = await crypto.subtle.importKey("raw", clave, "AES-GCM", false, ["decrypt"]);
    var plano = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(SOBRE.iv) }, k, bytes(SOBRE.datos));
    var flujo = new Blob([plano]).stream().pipeThrough(new DecompressionStream("gzip"));
    return await new Response(flujo).text();
  }
  function mostrar(html) { document.open(); document.write(html); document.close(); }

  // Lo que se recuerda es la clave derivada, no la frase.
  function recordada() {
    try { var v = localStorage.getItem(CLAVE_LS); return v ? bytes(v) : null; } catch (e) { return null; }
  }
  function guardar(clave) { try { localStorage.setItem(CLAVE_LS, base64(clave)); } catch (e) {} }
  function olvidar() {
    try {
      for (var i = localStorage.length - 1; i >= 0; i--) {
        var k = localStorage.key(i);
        if (k && k.indexOf("informe.clave.") === 0) localStorage.removeItem(k);
      }
    } catch (e) {}
  }

  async function iniciar() {
    if (!(window.crypto && crypto.subtle) || typeof DecompressionStream === "undefined") {
      campo.disabled = boton.disabled = true;
      decir("Este navegador no puede abrir el informe: hace falta uno reciente (Chrome o Edge, Safari 16.4, Firefox 113 o posteriores).", "navegador");
      return;
    }
    // «?olvidar» y no solo «#olvidar»: con el informe ya abierto, cambiar el
    // ancla no vuelve a cargar la página, y esto no llegaría a ejecutarse.
    if (/(^|[?&])olvidar(=|&|$)/.test(location.search.slice(1)) || location.hash === "#olvidar") {
      olvidar();
      try { history.replaceState(null, "", location.pathname); } catch (e) {}
      decir("Frase olvidada en este dispositivo.", "olvidada");
    }
    var clave = recordada();
    if (clave) {
      try { mostrar(await descifrar(clave)); return; } catch (e) { olvidar(); }
    }
    // Al volver a escribir, el error se va (el aviso de la frase olvidada, no).
    campo.addEventListener("input", function () {
      if (formulario.getAttribute("data-estado") === "error") decir("", "");
    });
    formulario.addEventListener("submit", async function (ev) {
      ev.preventDefault();
      var frase = campo.value;
      ocupado(true);
      decir("Abriendo…", "abriendo");
      try {
        var k = await derivar(frase);
        var html = await descifrar(k);
        if (recordar.checked) guardar(k);
        mostrar(html);
      } catch (e) {
        ocupado(false);
        decir("No se ha podido abrir: revisa la frase.", "error");
        campo.focus();
      }
    });
    campo.focus();
  }
  iniciar();
})();
